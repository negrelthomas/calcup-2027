<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match center | CalCup 2027</title>
<meta name="theme-color" content="#0C2138">
<link rel="stylesheet" href="assets/icons.css">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="CalCup home"><span class="brandmark"><span class="bm-cal">CAL</span><span class="bm-cup">CUP</span> <span class="bm-cal">XX</span></span></a>
    <button class="burger" id="burger" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
    <nav class="menu" id="menu"></nav>
  </div>
</header>
<section class="hero lc-hero" style="padding:22px 0 18px">

</section>
<div class="wrap lc-page"><div id="lc-app"><p class="muted">Loading...</p></div></div>
<section class="partners">
  <div class="wrap">
    <div class="grp"><span class="lbl">Hosted by</span><img src="assets/calheat-logo.png" alt="San Francisco CalHeat"></div>
    <div class="grp"><span class="lbl">Sanctioned by</span><img src="assets/usath-logo.png" alt="USA Team Handball"></div>
  </div>
</section>
<script src="data/data.js"></script>
<script src="app.js"></script>
<script src="assets/live-core.js"></script>
