<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C2138">
<title>Live scoring | CalCup 2027</title>
<link rel="stylesheet" href="assets/icons.css">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
:root{--navy:#0C2138;--navy-2:#1B3A5B;--orange:#F47920;--ink:#13202E;--muted:#5A6B7B;--line:#E5EAF0;--bg:#F6F8FA;--green:#0F6E56;--red:#A32D2D;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px}
button{font-family:inherit;font-size:inherit;cursor:pointer;touch-action:manipulation}
.top{background:var(--navy);color:#fff;padding:8px 12px calc(8px);position:sticky;top:0;z-index:5}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:'Saira Stencil One',var(--font);font-size:20px;letter-spacing:1px}
.brand b{color:var(--orange);font-weight:400}
.sync{font-size:12px;display:flex;align-items:center;gap:6px;color:#C3D0DE}
.dot{width:9px;height:9px;border-radius:50%;background:#3FB68B;display:inline-block}
.dot.wait{background:#E4B90B}.dot.off{background:#E05252}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;font-size:16px;padding:11px 12px;border:1px solid #CBD5E1;border-radius:9px;background:#fff;font-family:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:var(--navy);color:#fff}
.btn.pri{background:var(--orange);color:#3A1B02}.btn.ghost{background:#fff;color:var(--navy);border:1px solid #CBD5E1}
.btn.red{background:var(--red)}.btn.full{width:100%}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:1em}
.glist button{display:flex;width:100%;text-align:left;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.glist .no{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.glist .tt{flex:1}.glist .tt small{display:block;color:var(--muted)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#EEF2F6;color:var(--muted)}
.tag.live{background:#F7E3E3;color:var(--red)}
/* scoring screen */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:4px 0 2px}
.board .tn{font-size:13px;font-weight:700;line-height:1.15;display:flex;align-items:center;gap:6px}
.board .tn.b{justify-content:flex-end;text-align:right}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.5);flex:none}
.board .sc{font-size:38px;font-weight:800;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.clockrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.clk{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:96px;text-align:center;padding:3px 10px;border-radius:8px;background:#06121F}
.clk.stopped{color:#E4B90B}.clk.over{color:#FF7A7A}
.cbtn{background:var(--navy-2);color:#fff;border:0;border-radius:8px;padding:9px 11px;font-weight:700;font-size:13px}
.phase{font-size:12px;color:#C3D0DE;text-align:center;margin-top:4px}
.susp{font-size:12px;color:#FFD08A;min-height:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.col{display:flex;flex-direction:column;gap:8px}
.col h3{margin:0;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between}
.act{border:0;border-radius:12px;font-weight:800;padding:16px 6px;font-size:16px;color:#fff;background:var(--navy)}
.act.goal{background:#0F6E56;font-size:20px;padding:22px 6px}
.act.save{background:#1F5FA8}.act.miss{background:#5A6B7B}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act.sm{padding:12px 4px;font-size:13px;background:#fff;color:var(--ink);border:1px solid #CBD5E1}
.act.sm.y{border-color:#E4B90B}.act.sm.s2{border-color:#E05252}.act.sm.r{border-color:#A32D2D;color:#A32D2D}
.big-phase{margin:0 10px 10px}
.log{margin:0 10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.log h3{margin:0;padding:10px 12px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.ev{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.ev .t{font-variant-numeric:tabular-nums;color:var(--muted);width:44px;flex:none}
.ev .x{margin-left:auto;background:none;border:1px solid #E5B8B8;color:var(--red);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
.ev.clk-ev{color:var(--muted);font-size:13px}
.ev.pend .t:after{content:" •";color:#E4B90B}
.teamA{color:#0C2138}.teamB{color:#C75E12}
/* sheets */
.veil{position:fixed;inset:0;background:rgba(6,18,31,.55);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;z-index:21;max-height:88vh;overflow:auto;padding:14px 14px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .18s}
.sheet.open{transform:none}.veil.open{display:block}
.sheet h2{display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{background:none;border:0;font-size:22px;color:var(--muted)}
.zones{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.zones button{border:1px solid #CBD5E1;background:#fff;border-radius:8px;padding:9px 2px;font-size:12px;font-weight:700}
.zones button.on{background:var(--orange);border-color:var(--orange);color:#3A1B02}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.players button{border:1px solid #CBD5E1;background:#fff;border-radius:10px;padding:10px 2px 8px;min-height:62px}
.players button b{display:block;font-size:22px;line-height:1}
.players button small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;margin-top:3px}
.players button.gk{background:#F3F7FB}
.players button.unk{background:#F6F8FA}
.keypad{display:flex;gap:8px;margin-top:10px}
.keypad input{flex:1}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:22px;font-size:14px;z-index:30;display:none;max-width:90vw}
@media (min-width:700px){.act{font-size:18px}.players{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p class="muted">Loading...</p></div></div>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script src="data/data.js"></script>
<script src="assets/live-core.js"></script>
<script src="score.js"></script>
</body>
</html>
